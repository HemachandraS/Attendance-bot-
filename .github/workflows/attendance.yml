name: HR One Attendance Bot

on:
  schedule:
    # Run every Monday to Friday at 10:00 AM IST (which is 04:30 AM UTC)
    - cron: '30 4 * * 1-5'
  workflow_dispatch:
    # Allows manual triggering of the workflow from the GitHub Actions tab

jobs:
  mark-attendance:
    name: Mark Attendance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Restore Session Cache
        uses: actions/cache@v4
        with:
          path: session.json
          # Use a dynamic key so a new cache entry is saved on every run
          key: hro-session-${{ github.run_id }}
          # Restore the most recent cache entry matching this prefix
          restore-keys: |
            hro-session-

      - name: Install Playwright Chromium Browser
        run: npx playwright install chromium --with-deps

      - name: Run Attendance Bot
        env:
          HRONE_URL: ${{ secrets.HRONEURL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          HEADLESS: 'true'
          TIMEZONE: 'Asia/Kolkata'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAMBOTTOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAMCHATID }}
          ENABLE_NOTIFICATIONS: 'true'
        run: |
          npm run build
          npm start

      # Upload screenshots as artifacts regardless of run success/failure
      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore

      # Upload logs as artifacts regardless of run success/failure
      - name: Upload Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-logs
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
